# ===================================================================
# BidSphere - Application Configuration
# ===================================================================

# Server
server.port=8080

# ---- MySQL Database ----
spring.datasource.url=jdbc:mysql://localhost:3306/bidsphere_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---- JWT ----
app.jwt.secret=BidSphereSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLong2024!
app.jwt.expiration-ms=86400000

# ---- CORS ----
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:4200,http://localhost:5174

# ---- File Upload ----
app.upload.dir=./uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ---- Mail (Mailtrap for testing) ----
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=your_mailtrap_username
spring.mail.password=your_mailtrap_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---- Async ----
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100

# ---- Scheduling ----
app.auction.close-rate-ms=30000

# ---- Anti-sniping ----
app.auction.snipe-threshold-minutes=2
app.auction.snipe-extension-minutes=2

# ---- Logging ----
logging.level.com.bidsphere=DEBUG
logging.level.org.springframework.security=INFO

# ---- SQL Init (seed categories) ----
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true


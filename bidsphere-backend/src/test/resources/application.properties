# H2 in-memory DB for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.jwt.secret=TestSecretKeyForBidSphereApplicationTestingOnlyMustBe256BitsLong!
app.jwt.expiration-ms=3600000

app.cors.allowed-origins=http://localhost:4200,http://localhost:3000,http://localhost:5173
app.upload.dir=./target/test-uploads

spring.mail.host=localhost
spring.mail.port=25
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

app.auction.close-rate-ms=60000
app.auction.snipe-threshold-minutes=2
app.auction.snipe-extension-minutes=2

spring.sql.init.mode=never
